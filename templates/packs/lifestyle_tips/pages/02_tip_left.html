<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F7F4EE;
      --text: #2A2623;
      --font-serif: "Playfair Display", Georgia, serif;
      --font-sans: "Inter", system-ui, sans-serif;
      --font-script: "Great Vibes", cursive;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1080px; height: 1350px; overflow: hidden; background: var(--bg); }
    #canvas {
      width: 1080px; height: 1350px; background: var(--bg); color: var(--text);
      position: relative; padding: 88px 72px 72px;
      display: flex; flex-direction: column;
    }
    .row {
      flex: 1 1 auto; display: grid; grid-template-columns: 1fr 1fr;
      gap: 48px; align-items: center; margin-top: 72px; min-height: 0;
    }
    .photo {
      width: 100%; height: 820px; border-radius: 40px; overflow: hidden;
    }
    .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .copy { padding-right: 8px; }
    .num {
      font-family: var(--font-script); font-size: 92px; line-height: 1;
      margin-bottom: 12px;
    }
    .title {
      font-family: var(--font-serif); font-weight: 700; font-size: 52px;
      line-height: 1.05; text-transform: uppercase; white-space: pre-line;
      margin-bottom: 28px;
    }
    .body {
      font-family: var(--font-sans); font-weight: 400; font-size: 26px;
      line-height: 1.45; white-space: pre-line; max-width: 420px;
    }
    .pill {
      position: absolute; right: 72px; bottom: 72px;
      font-family: var(--font-sans); font-weight: 500; font-size: 20px;
      letter-spacing: 0.12em; text-transform: uppercase;
      border: 2px solid var(--text); border-radius: 999px;
      padding: 14px 32px; display: inline-flex; align-items: center; gap: 16px;
      background: var(--bg);
    }
    .pill .arrow { font-size: 26px; line-height: 1; }
  </style>
</head>
<body>
  <div id="canvas">
    <div class="row">
      <div class="photo"><img src="{{image_url}}" alt="" /></div>
      <div class="copy">
        <div class="num">{{page_number}}.</div>
        <h1 class="title">{{title}}</h1>
        <p class="body">{{body}}</p>
      </div>
    </div>
    <div class="pill">{{next}} <span class="arrow">→</span></div>
  </div>
</body>
</html>
