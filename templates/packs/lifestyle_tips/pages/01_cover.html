<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F7F4EE;
      --text: #2A2623;
      --font-serif: "Playfair Display", Georgia, serif;
      --font-sans: "Inter", system-ui, sans-serif;
      --font-script: "Great Vibes", cursive;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1080px; height: 1350px; overflow: hidden; background: var(--bg); }
    #canvas {
      width: 1080px; height: 1350px; background: var(--bg); color: var(--text);
      position: relative; padding: 88px 0 72px 88px;
    }
    .copy {
      margin-top: 120px; max-width: 620px; position: relative; z-index: 2;
    }
    .script {
      font-family: var(--font-script); font-weight: 400; font-size: 64px;
      line-height: 1; margin-bottom: 18px;
    }
    .title {
      font-family: var(--font-serif); font-weight: 700; font-size: 78px;
      line-height: 1.02; letter-spacing: -0.01em; text-transform: uppercase;
      white-space: pre-line;
    }
    .peek {
      position: absolute; top: 280px; right: -120px; width: 420px; height: 720px;
      border-radius: 48px; overflow: hidden; z-index: 1;
    }
    .peek img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pill {
      position: absolute; right: 72px; bottom: 72px;
      font-family: var(--font-sans); font-weight: 500; font-size: 20px;
      letter-spacing: 0.18em; text-transform: uppercase;
      border: 2px solid var(--text); border-radius: 999px;
      padding: 16px 36px; display: inline-flex; align-items: center; gap: 18px;
      background: var(--bg); z-index: 3;
    }
    .pill .arrow { font-size: 28px; line-height: 1; }
  </style>
</head>
<body>
  <div id="canvas">
    <div class="copy">
      <div class="script">{{script}}</div>
      <h1 class="title">{{title}}</h1>
    </div>
    <div class="peek"><img src="{{image_url}}" alt="" /></div>
    <div class="pill">Swipe <span class="arrow">→</span></div>
  </div>
</body>
</html>
