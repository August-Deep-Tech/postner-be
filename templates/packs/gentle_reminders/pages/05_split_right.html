<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --canvas-w: 1080px;
      --canvas-h: 1350px;
      --bg: #F3F0E8;
      --text: #0B0B0B;
      --accent: #3B6FD8;
      --accent-shape: #3B6FD8;
      --on-accent: #FFFFFF;
      --font-serif: "Playfair Display", Georgia, serif;
      --font-sans: "Inter", system-ui, sans-serif;
      --strip-width: 12%;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: var(--canvas-w); height: var(--canvas-h); overflow: hidden; background: var(--accent); }
    #canvas {
      width: var(--canvas-w); height: var(--canvas-h);
      display: grid; grid-template-columns: 1fr var(--strip-width);
      container-type: size;
      container-name: canvas;
    }
    .content {
      background: var(--accent); color: var(--on-accent);
      padding: clamp(56px, 8.2cqh, 110px) clamp(30px, 8.1cqw, 88px) clamp(42px, 6.8cqh, 90px) clamp(34px, 10.2cqw, 110px);
      display: flex; flex-direction: column; align-items: center; min-width: 0;
    }
    .brand {
      font-family: var(--font-sans); font-weight: 700; font-size: 28px;
      letter-spacing: 0.28em; text-transform: uppercase; color: var(--on-accent);
      text-align: center; width: 100%;
    }
    .main {
      flex: 1 1 auto; display: flex; flex-direction: column;
      justify-content: center; gap: 44px; width: 100%; max-width: 760px;
      padding-bottom: 40px;
    }
    .title {
      font-family: var(--font-serif); font-weight: 600; font-size: clamp(36px, 5cqh, 64px);
      line-height: 1.12; letter-spacing: -0.02em; white-space: pre-line;
      text-align: left;
    }
    .body {
      font-family: var(--font-sans); font-weight: 400; font-size: clamp(20px, 2.7cqh, 32px);
      line-height: 1.45; white-space: pre-line; text-align: left; max-width: 700px;
    }
    .page {
      font-family: var(--font-sans); font-weight: 600; font-size: 28px;
      color: var(--on-accent); text-align: center; width: 100%;
    }
    .strip { background: var(--bg); width: 100%; height: 100%; }

    @container canvas (min-aspect-ratio: 4/3) {
      #canvas { grid-template-columns: 1fr 10%; }
      .main { max-width: 70cqw; gap: clamp(18px, 2.5cqh, 32px); }
      .body { max-width: 64cqw; }
    }

    @container canvas (max-aspect-ratio: 9/16) {
      #canvas { grid-template-columns: 1fr 14%; }
      .main { max-width: 74cqw; gap: clamp(18px, 3.1cqh, 42px); }
      .title { font-size: clamp(44px, 5.9cqh, 96px); }
      .body { font-size: clamp(22px, 2.7cqh, 40px); max-width: 70cqw; }
    }
  </style>
</head>
<body>
  <div id="canvas">
    <div class="content">
      <div class="brand">{{brand}}</div>
      <div class="main">
        <h1 class="title">{{title}}</h1>
        <p class="body">{{body}}</p>
      </div>
      <div class="page">{{page_number}}</div>
    </div>
    <div class="strip" aria-hidden="true"></div>
  </div>
</body>
</html>
