<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F3F0E8;
      --text: #0B0B0B;
      --accent: #3B6FD8;
      --accent-shape: #3B6FD8;
      --on-accent: #FFFFFF;
      --font-serif: "Playfair Display", Georgia, serif;
      --font-sans: "Inter", system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1080px; height: 1350px; overflow: hidden; background: var(--bg); }
    #canvas {
      width: 1080px; height: 1350px; background: var(--bg); color: var(--text);
      display: flex; flex-direction: column; align-items: center;
      padding: 110px 100px 90px; text-align: center; position: relative;
    }
    .brand {
      font-family: var(--font-sans); font-weight: 700; font-size: 28px;
      letter-spacing: 0.28em; text-transform: uppercase; color: var(--accent);
    }
    .main {
      flex: 1 1 auto; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 56px;
      width: 100%; max-width: 860px; padding-bottom: 40px;
    }
    .title {
      font-family: var(--font-serif); font-weight: 600; font-size: 64px;
      line-height: 1.12; letter-spacing: -0.015em; white-space: pre-line;
      max-width: 820px;
    }
    .body {
      font-family: var(--font-sans); font-weight: 400; font-size: 32px;
      line-height: 1.45; white-space: pre-line; max-width: 780px;
    }
    .body .em { font-weight: 700; }
    .page {
      font-family: var(--font-sans); font-weight: 600; font-size: 28px;
      color: var(--accent); letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div id="canvas">
    <div class="brand">{{brand}}</div>
    <div class="main">
      <h1 class="title">{{title}}</h1>
      <p class="body">{{body}} <span class="em">{{body_emphasis}}</span></p>
    </div>
    <div class="page">{{page_number}}</div>
  </div>
</body>
</html>
