<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --canvas-w: 1080px;
      --canvas-h: 1350px;
      --bg: #F3F0E8;
      --text: #0B0B0B;
      --accent: #3B6FD8;
      --accent-shape: #3B6FD8;
      --on-accent: #FFFFFF;
      --font-serif: "Playfair Display", Georgia, serif;
      --font-sans: "Inter", system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: var(--canvas-w); height: var(--canvas-h); overflow: hidden; background: var(--accent); }
    #canvas {
      width: var(--canvas-w); height: var(--canvas-h); background: var(--accent); color: var(--on-accent);
      display: flex; flex-direction: column; align-items: center;
      padding: clamp(56px, 8.2cqh, 110px) clamp(34px, 10.1cqw, 110px) clamp(42px, 6.8cqh, 90px);
      text-align: left; position: relative;
      container-type: size;
      container-name: canvas;
    }
    .brand {
      font-family: var(--font-sans); font-weight: 700; font-size: 28px;
      letter-spacing: 0.28em; text-transform: uppercase; color: var(--on-accent);
      text-align: center; width: 100%; opacity: 0.95;
    }
    .main {
      flex: 1 1 auto; display: flex; flex-direction: column;
      justify-content: center; gap: 44px; width: 100%; max-width: 820px;
      padding: 0 20px 48px;
    }
    .title {
      font-family: var(--font-serif); font-weight: 600; font-size: clamp(38px, 5.2cqh, 68px);
      line-height: 1.12; letter-spacing: -0.02em; white-space: pre-line;
    }
    .body {
      font-family: var(--font-sans); font-weight: 400; font-size: clamp(20px, 2.7cqh, 32px);
      line-height: 1.45; white-space: pre-line; max-width: 760px;
    }
    .page {
      font-family: var(--font-sans); font-weight: 600; font-size: 28px;
      color: var(--on-accent); text-align: center; width: 100%;
    }

    @container canvas (min-aspect-ratio: 4/3) {
      .main { max-width: 72cqw; padding-inline: 0; gap: clamp(16px, 2.6cqh, 32px); }
      .body { max-width: 72cqw; }
    }

    @container canvas (max-aspect-ratio: 9/16) {
      .main { max-width: 82cqw; gap: clamp(18px, 3.1cqh, 40px); }
      .title { font-size: clamp(46px, 6.2cqh, 98px); }
      .body { font-size: clamp(22px, 2.7cqh, 42px); max-width: 82cqw; }
    }
  </style>
</head>
<body>
  <div id="canvas">
    <div class="brand">{{brand}}</div>
    <div class="main">
      <h1 class="title">{{title}}</h1>
      <p class="body">{{body}}</p>
    </div>
    <div class="page">{{page_number}}</div>
  </div>
</body>
</html>
