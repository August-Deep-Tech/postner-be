<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg: #ff5c39;
      --text: #0a0a0a;
      --accent: #5b6cff;
      --accent-shape: #5b6cff;
      --font-family: "Outfit", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      background: var(--bg);
    }

    #canvas {
      width: 1080px;
      height: 1080px;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-family);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 96px 88px 72px;
      text-align: center;
    }

    .headline {
      flex: 0 0 auto;
      max-width: 860px;
      font-weight: 800;
      font-size: 92px;
      line-height: 1.05;
      letter-spacing: -0.03em;
      text-wrap: balance;
      white-space: pre-line;
    }

    .hero {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 0;
      padding: 24px 0;
    }

    .hero img {
      max-width: 520px;
      max-height: 420px;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }

    .brand {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .logo {
      font-weight: 800;
      font-size: 56px;
      line-height: 1;
      letter-spacing: -0.02em;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .logo-img {
      display: none;
      max-height: 72px;
      max-width: 280px;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    .logo-img[src]:not([src=""]) {
      display: block;
    }

    .logo:has(.logo-img[src]:not([src=""])) .logo-text {
      display: none;
    }

    .tagline {
      font-weight: 400;
      font-size: 22px;
      line-height: 1.3;
      max-width: 720px;
      opacity: 0.95;
    }

    .cta-link {
      display: none;
    }
  </style>
</head>
<body>
  <div id="canvas">
    <h1 class="headline">{{caption}}</h1>

    <div class="hero">
      <img src="{{image_url}}" alt="" />
    </div>

    <footer class="brand">
      <div class="logo">
        <img class="logo-img" src="{{logo_url}}" alt="" />
        <span class="logo-text">{{brand}}</span>
      </div>
      <p class="tagline">{{tagline}}</p>
      <a class="cta-link" href="{{cta_link}}">{{cta_link}}</a>
    </footer>
  </div>
</body>
</html>
