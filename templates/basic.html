<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --canvas-w: 1080px;
      --canvas-h: 1080px;
      --bg: #ff5c39;
      --text: #0a0a0a;
      --accent: #5b6cff;
      --accent-shape: #5b6cff;
      --font-family: "Outfit", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: var(--canvas-w);
      height: var(--canvas-h);
      overflow: hidden;
      background: var(--bg);
    }

    #canvas {
      width: var(--canvas-w);
      height: var(--canvas-h);
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-family);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: clamp(48px, 8cqh, 96px) clamp(40px, 8cqw, 88px) clamp(36px, 6cqh, 72px);
      text-align: center;
      container-type: size;
      container-name: canvas;
    }

    .headline {
      flex: 0 0 auto;
      max-width: 860px;
      font-weight: 800;
      font-size: clamp(48px, 8.5cqh, 92px);
      line-height: 1.05;
      letter-spacing: -0.03em;
      text-wrap: balance;
      white-space: pre-line;
    }

    .hero {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 0;
      padding: 24px 0;
    }

    .hero img {
      max-width: min(64cqw, 520px);
      max-height: min(40cqh, 420px);
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }

    .brand {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .logo {
      font-weight: 800;
      font-size: clamp(34px, 5.2cqh, 56px);
      line-height: 1;
      letter-spacing: -0.02em;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .logo-img {
      display: none;
      max-height: 72px;
      max-width: 280px;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    .logo-img[src]:not([src=""]) {
      display: block;
    }

    .logo:has(.logo-img[src]:not([src=""])) .logo-text {
      display: none;
    }

    .tagline {
      font-weight: 400;
      font-size: clamp(16px, 2.1cqh, 22px);
      line-height: 1.3;
      max-width: 720px;
      opacity: 0.95;
    }

    @container canvas (min-aspect-ratio: 4/3) {
      #canvas {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        gap: clamp(18px, 3cqw, 40px);
      }
      .headline {
        flex: 0 1 40%;
        text-align: left;
      }
      .hero {
        flex: 0 1 34%;
      }
      .brand {
        flex: 0 1 24%;
        align-items: flex-end;
        text-align: right;
      }
      .tagline {
        max-width: 24cqw;
      }
    }

    @container canvas (max-aspect-ratio: 9/16) {
      #canvas {
        padding-top: clamp(88px, 10cqh, 180px);
        padding-bottom: clamp(60px, 8cqh, 120px);
      }
      .headline {
        max-width: 78cqw;
        font-size: clamp(58px, 8.5cqh, 130px);
      }
      .hero img {
        max-width: min(72cqw, 620px);
        max-height: min(36cqh, 520px);
      }
    }

    .cta-link {
      display: none;
    }
  </style>
</head>
<body>
  <div id="canvas">
    <h1 class="headline">{{caption}}</h1>

    <div class="hero">
      <img src="{{image_url}}" alt="" />
    </div>

    <footer class="brand">
      <div class="logo">
        <img class="logo-img" src="{{logo_url}}" alt="" />
        <span class="logo-text">{{brand}}</span>
      </div>
      <p class="tagline">{{tagline}}</p>
      <a class="cta-link" href="{{cta_link}}">{{cta_link}}</a>
    </footer>
  </div>
</body>
</html>
