services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postner
      POSTGRES_PASSWORD: postner
      POSTGRES_DB: postner
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postner -d postner"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped


  api:
    build: .
    ports:
      - "8001:8000"
    env_file:
      - .env
      - .env.local
    environment:
      DATABASE_URL: postgresql+psycopg://postner:postner@db:5432/postner
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-postner}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:?}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:?}
      STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:?}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:?}
      STORAGE_REGION: ${STORAGE_REGION:-auto}
      STORAGE_ADDRESSING_STYLE: ${STORAGE_ADDRESSING_STYLE:-auto}
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./templates:/app/templates
      - ./variants:/app/variants
      - ./brands:/app/brands
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
